[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightpanda"
version = "0.1.0.dev0"
description = "Lightpanda headless browser: scrape and automate the web from Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Lightpanda" }]
keywords = ["browser", "headless", "scraping", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Homepage = "https://lightpanda.io"
Repository = "https://github.com/lightpanda-io/lightpanda-python"

[project.scripts]
lightpanda = "lightpanda.cli:main"

[tool.setuptools]
packages = ["lightpanda"]

[tool.setuptools.package-data]
lightpanda = ["lightpanda", "lightpanda.exe", "py.typed"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "playwright>=1.45"]
docs = ["pdoc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
